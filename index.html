<!DOCTYPE html>
<html>
<head>
  <title>Portofolio Pertama Saya</title>
  <style>
    /* Mengatur warna latar belakang halaman dan jenis huruf */
    body {
      background-color: #121212; /* Warna gelap modern (Dark Mode) */
      color: #ffffff;            /* Warna tulisan putih */
      font-family: sans-serif;   /* Jenis huruf bersih tanpa kait */
      padding: 20px;             /* Jarak ruang di pinggir layar */
    }

    /* Membuat kotak kartu untuk profil */
    .kartu-profil {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;       /* Membuat sudut kotak melengkung */
      border: 1px solid #333333;
    }

    /* Memberi warna aksen biru pada judul utama */
    h1 {
      color: #4da6ff;
      font-size: 24px;
    }

    /* Mengubah link biasa menjadi seperti tombol yang bisa diklik */
    .tombol {
      display: inline-block;
      background-color: #4da6ff;
      color: #121212;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="kartu-profil">
    <h1>I Love you epaa <3 </h1>

      <li> desain dan tampilan </li> Web (CSS)</li>
    </ul>

</html>
